# Supabase Configuration
# This file is used by the Supabase CLI for local development

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
# Matches the 2MB application limit in src/lib/storage/images.ts.
file_size_limit = "2MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
# Public sign-up is disabled: accounts are created by the project owner and
# granted access by inserting into public.admins. With sign-up enabled, any
# visitor could create an auth user.
enable_signup = false
enable_anonymous_sign_ins = false
min_password_length = 8
password_min_entropy = 30
