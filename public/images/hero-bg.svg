<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!--
    Hero backdrop. A schematic, not a photograph and not a glow.

    The whole point of the redesign was that the old hero decorated with light —
    blurred colour pools, a masked grid, a gradient name — and it read as a
    template. This is the opposite: a fairly quiet technical drawing, so it can
    sit behind a display-size name without being asked to hold it up.

    The motifs are schematic vocabulary on purpose. A field of dots is a
    substrate; orthogonal traces are how a net list stops being abstract on a
    board; the amber route is the one that carries signal, in the site's single
    accent. Bootstrapped in amber, everything else in a neutral that stays
    under the border colour's opacity so the text column never fights it.

    The canvas is transparent — the page's own `--bg` charcoal shows through —
    and `hero.svg` is consumed by `background-image` with `cover`, so a vector
    scales to any viewport without a resolution cost. That is the "HD" part: no
    bounding box, no source file to re-export.
  -->

  <defs>
    <!-- Two dots per tile at ragged intents, so the field is not a checkerboard. -->
    <pattern id="substrate" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="16" r="1.4" fill="#a5a9c0"/>
      <circle cx="45" cy="42" r="1.1" fill="#a5a9c0"/>
    </pattern>

    <!-- Thins the quiet drawing toward the bottom of the section, so it meets
         the next section's rule as darkness rather than an edge. -->
    <linearGradient id="sheet-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1600" height="900" fill="url(#sheet-fade)"/>
    </mask>
  </defs>

  <g mask="url(#fade)">
    <!-- Substrate. The named pattern keeps the dot field cheap and uniform;
         the mask is what makes it feel lit rather than tiled. -->
    <rect width="1600" height="900" fill="url(#substrate)" opacity="0.45"/>

    <!-- Orthogonal traces, in the board's passive colour. -->
    <g fill="none" stroke="#7d81a3" stroke-width="1">
      <path d="M40 150 H330 V250 H560 V190 H1240" opacity="0.4"/>
      <path d="M60 430 V310 H340 V235 H700" opacity="0.32"/>
      <path d="M640 760 V560 H1120 V420 H1520" opacity="0.36"/>
      <path d="M1180 120 V300 H1380" opacity="0.3"/>
    </g>

    <!-- Passive junction nodes, where a trace changes direction. -->
    <g fill="#a5a9c0">
      <circle cx="40" cy="150" r="2"/>
      <circle cx="330" cy="250" r="2"/>
      <circle cx="560" cy="190" r="2"/>
      <circle cx="60" cy="430" r="2"/>
      <circle cx="340" cy="235" r="2"/>
      <circle cx="640" cy="760" r="2"/>
      <circle cx="1120" cy="420" r="2"/>
      <circle cx="1180" cy="120" r="2"/>
      <circle cx="1380" cy="300" r="2"/>
    </g>
  </g>

  <!-- The live route, in the accent. Unmasked so it holds to the bottom edge —
       one warm line is what gives the drawing a subject. -->
  <g>
    <path d="M340 856 V700 H820 V600 H1210 V480" fill="none" stroke="#f59e0b" stroke-width="1.25" opacity="0.52"/>
    <g fill="#f59e0b">
      <circle cx="340" cy="856" r="2.6"/>
      <circle cx="340" cy="700" r="2.4"/>
      <circle cx="820" cy="600" r="3"/>
      <circle cx="1210" cy="480" r="2.4"/>
    </g>
  </g>
</svg>