<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!--
    Hero backdrop: one pane, whole. The layout keeps the picture safe and the
    pane intact at every viewport is this sheet's whole trick.

    bg-cover + bg-bottom shows the lower band of the canvas on every aspect
    ratio, and a phone crops the sides down to a centred slice about 300 units
    wide around x 800. So the picture's primary subject has to be a single
    window that fits inside that slice: x 660 to 940, y 600 to 860. A phone
    gets the entire pane, framed by the substrate on both sides. Desktop room
    is paid for with garnish outside the slice - a sheet peeking from the left
    and one amber route leaving to the right - so wide screens still get a
    workbench, without letting anything reach the phone's view.

    Lower it keeps the chrome out of the stacked text: on a phone nothing of
    the pane crosses the headline, and what fades in behind the index is veiled
    again in hero.tsx. ASCII comments only: an em-dash in one of these made the
    SVG unparseable before, once.
  -->

  <defs>
    <pattern id="substrate" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="16" r="1.3" fill="#9aa0b8"/>
      <circle cx="45" cy="42" r="1" fill="#9aa0b8"/>
    </pattern>

    <!-- Dissolve the edges of the sheet so nothing ends in a hard rectangle. -->
    <linearGradient id="fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sheet-fade">
      <rect width="1600" height="900" fill="url(#fade-y)"/>
    </mask>
    <mask id="panel-fade">
      <rect width="1600" height="900" fill="url(#fade-x)"/>
    </mask>
  </defs>

  <!-- Substrate: safe grain on phones and wallpaper on wide screens. -->
  <g mask="url(#sheet-fade)">
    <rect width="1600" height="900" fill="url(#substrate)" opacity="0.4"/>
    <g fill="none" stroke="#8b8fa8" stroke-width="1" opacity="0.22">
      <path d="M120 300 H420 V360 H760"/>
      <path d="M160 210 H520 V270 H860"/>
    </g>
  </g>

  <g mask="url(#panel-fade)">
    <!-- Desktop-only garnish, left: a second sheet half-hidden behind the pane. -->
    <g transform="rotate(-2 535 755)">
      <rect x="430" y="650" width="210" height="210" rx="12" fill="#1b1b28" stroke="#3a3a54" stroke-width="1"/>
      <g fill="#3a3a50">
        <rect x="458" y="692" width="120" height="8" rx="2" opacity="0.55"/>
        <rect x="458" y="712" width="90" height="8" rx="2" opacity="0.45"/>
        <rect x="458" y="732" width="150" height="8" rx="2" opacity="0.4"/>
      </g>
    </g>

    <!-- The pane itself: the whole subject, sized to fit the phone's slice. -->
    <g transform="rotate(-1.2 800 730)">
      <rect x="660" y="600" width="280" height="260" rx="12" fill="#1c1c2b" stroke="#4c4c6c" stroke-width="1.2"/>

      <!-- A hair of amber along the lit top edge. -->
      <path d="M676 601.5 H924" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>

      <!-- Title bar: traffic lights, one lit, and an address pill. -->
      <path d="M672 600 H928 A12 12 0 0 1 940 612 V636 H660 V612 A12 12 0 0 1 672 600 Z" fill="#222232"/>
      <circle cx="686" cy="618" r="4" fill="#545476"/>
      <circle cx="704" cy="618" r="4" fill="#545476"/>
      <circle cx="722" cy="618" r="4" fill="#f59e0b"/>
      <rect x="756" y="609" width="128" height="18" rx="9" fill="#101018" stroke="#3b3b55" stroke-width="1"/>
      <circle cx="768" cy="618" r="2.4" fill="#f59e0b" opacity="0.85"/>
      <rect x="780" y="614" width="74" height="8" rx="2" fill="#42425c" opacity="0.7"/>

      <!-- Activity gutter: a column of marks, one live. -->
      <g fill="#52526f">
        <circle cx="684" cy="656" r="2.6" opacity="0.7"/>
        <circle cx="684" cy="676" r="2.6" opacity="0.7"/>
        <circle cx="684" cy="696" r="2.6" opacity="0.5"/>
      </g>
      <circle cx="684" cy="716" r="3.4" fill="#f59e0b"/>

      <!-- Editor: code reads as rows of bars, the live lines amber. -->
      <rect x="704" y="648" width="150" height="8" rx="2" fill="#5a5a7a" opacity="0.9"/>
      <rect x="704" y="672" width="104" height="8" rx="2" fill="#f59e0b" opacity="0.9"/>
      <rect x="704" y="696" width="176" height="8" rx="2" fill="#4c4c6a" opacity="0.85"/>
      <rect x="704" y="720" width="132" height="8" rx="2" fill="#5a5a7a" opacity="0.85"/>
      <rect x="704" y="744" width="70" height="8" rx="2" fill="#454563" opacity="0.9"/>
      <rect x="704" y="768" width="164" height="8" rx="2" fill="#4c4c6a" opacity="0.8"/>
      <rect x="704" y="792" width="118" height="8" rx="2" fill="#f59e0b" opacity="0.8"/>

      <!-- Output card inside the pane: a line chart, one segment amber. -->
      <rect x="858" y="648" width="66" height="132" rx="6" fill="#1d1d2b" stroke="#3a3a54" stroke-width="1"/>
      <path d="M868 762 L894 728 L912 742 L914 706" fill="none" stroke="#9aa0b8" stroke-width="1.6" opacity="0.9"/>
      <circle cx="914" cy="706" r="3" fill="#f59e0b"/>
    </g>

    <!-- Desktop-only garnish, right: one amber route leaving the pane. -->
    <path d="M948 712 H1140" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    <circle cx="1146" cy="712" r="3.4" fill="#f59e0b" opacity="0.75"/>
    <circle cx="300" cy="752" r="4" fill="#8b8fa8" opacity="0.5"/>
  </g>
</svg>